name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check Gradle
        run: |
          java -version
          gradle --version

      - name: Prepare stable signing
        env:
          KEYSTORE_B64: ${{ secrets.XIANYU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XIANYU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XIANYU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XIANYU_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Stable signing secrets are required. Configure XIANYU_KEYSTORE_BASE64, XIANYU_KEYSTORE_PASSWORD, XIANYU_KEY_ALIAS and XIANYU_KEY_PASSWORD in GitHub repository secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > xianyu-release.jks
          cat > signing.properties <<EOF
          storeFile=xianyu-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Stable signing configured."


      - name: Build Debug APK
        run: |
          gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: List APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xianyu-v4.43.9-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
